# .github/workflows/prod-deploy.yml
name: Trigger Comparison Job

on:
  workflow_dispatch:
    inputs:
      analysis_type:
        description: 'Type of benefit analysis to run'
        required: true
        type: choice
        options:
          - Rx
          - Non-Rx
        default: 'Non-Rx'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sidecar-data-monitor-benefit-amount
  BATCH_JOB_NAME: sidecar_data_monitor_benefit_amount

jobs:
  build-and-deploy:
    name: Build Image and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: set_vars
        run: |
          ANALYSIS_TYPE="${{ github.event.inputs.analysis_type }}"
          
          echo "analysis_type=${ANALYSIS_TYPE}" >> $GITHUB_OUTPUT
          
          echo "Analysis Type: ${ANALYSIS_TYPE}"

      - name: Configure DEV AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to DEV ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to DEV ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Building Docker image from monitor_benefit_amount folder..."
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest ./monitor_benefit_amount
          
          echo "Pushing image to DEV ECR..."
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          
          echo "Image pushed successfully to DEV ECR: $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"

      - name: Configure PROD AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Submit Batch job
        id: batch_job
        run: |
          ANALYSIS_TYPE=${{ steps.set_vars.outputs.analysis_type }}
          BATCH_JOB_NAME="${{ env.BATCH_JOB_NAME }}"
          
          echo "Submitting Batch job: ${BATCH_JOB_NAME}"
          echo "Analysis type: ${ANALYSIS_TYPE}"
          
          JOB_ID=$(aws batch submit-job \
            --job-name sidecar_data_monitor_benefit_amount \
            --job-queue de_operational_env_priority_1 \
            --job-definition ${BATCH_JOB_NAME} \
            --parameters "ENVIRONMENT=prod" \
            --query 'jobId' \
            --output text)
          
          if [ -n "$JOB_ID" ] && [ "$JOB_ID" != "None" ]; then
            echo "Job submitted: ${JOB_ID}"
            echo "job_id=${JOB_ID}" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Failed to submit job"
            exit 1
          fi